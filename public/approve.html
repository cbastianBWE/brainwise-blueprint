<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>BrainWise approval</title>
<style>
  :root {
    color-scheme: light;
    --navy:#021F36; --ink:#1b1f24; --muted:#5b6470; --line:#e3e6ea;
    --go:#0f766e; --warn:#92400e; --bad:#b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background:#f6f7f9; margin:0; padding:24px 16px 48px; color:var(--ink); line-height:1.55;
  }
  .card {
    max-width:680px; margin:0 auto; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:24px 20px 28px;
  }
  h1 { font-size:20px; margin:0 0 4px; color:var(--navy); }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .tag {
    display:inline-block; background:#eef2f7; color:#374151; border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600;
  }
  dl { margin:0; }
  dt {
    font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    margin-top:18px; font-weight:600;
  }
  dd { margin:4px 0 0; }
  dd.risk { border-left:3px solid #d97706; padding-left:12px; color:var(--warn); }
  pre {
    background:#0f172a; color:#e2e8f0; padding:14px 16px; border-radius:8px; overflow-x:auto;
    font-size:12.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; margin:6px 0 0;
  }
  hr { border:0; border-top:1px solid #eceef1; margin:24px 0 0; }
  label { display:block; font-size:13px; color:var(--muted); margin:20px 0 6px; }
  textarea {
    width:100%; font:inherit; font-size:15px; padding:10px 12px; border:1px solid #d1d5db;
    border-radius:8px; min-height:92px; resize:vertical;
  }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  button {
    font:inherit; font-size:15px; font-weight:600; padding:12px 22px; border-radius:8px;
    border:1px solid transparent; cursor:pointer; min-height:46px;
  }
  button[disabled] { opacity:.55; cursor:default; }
  .approve { background:var(--go); color:#fff; }
  .adjust { background:#fff; color:var(--go); border-color:var(--go); }
  .reject { background:#fff; color:#374151; border-color:#d1d5db; }
  .note { color:var(--muted); font-size:12px; margin-top:20px; }
  .bad { color:var(--bad); }
  .hint { color:var(--bad); font-size:13px; margin:8px 0 0; }
  @media (max-width: 420px) {
    .actions { flex-direction:column; }
    .actions button { width:100%; }
  }
</style>
</head>
<body>
<div class="card" id="root" aria-live="polite"><p class="sub" id="boot">Loading…</p></div>
<script>
(function () {
  "use strict";

  var ENDPOINT = "https://svprhtzawnbzmumxnhsq.supabase.co/functions/v1/agent-approve";

  var root = document.getElementById("root");
  var token = new URLSearchParams(window.location.search).get("t") || "";

  // The build injects an analytics script that reports window.location.href on page load.
  // The token in the query string is a bearer credential for approving a platform change, so
  // it has no business in an analytics store. Take it out of the URL as soon as it is read.
  // This script is inline and runs during parsing; the analytics script is deferred and waits
  // a further 300ms, so it only ever sees the cleaned URL. The token stays in the variable
  // above, so the page works normally until the tab is closed.
  if (token && window.history && window.history.replaceState) {
    try {
      window.history.replaceState(null, "", window.location.pathname + "?opened=1");
    } catch (e) { /* a browser that refuses this is no reason to fail the page */ }
  }

  // Every value below comes from the database. It is built with textContent, never innerHTML,
  // so a proposal containing SQL or angle brackets renders as text and cannot inject markup.
  function el(tag, text, cls) {
    var n = document.createElement(tag);
    if (text !== undefined && text !== null && text !== "") n.textContent = String(text);
    if (cls) n.className = cls;
    return n;
  }

  function clear() { while (root.firstChild) root.removeChild(root.firstChild); }

  function simple(heading, sub, headingClass) {
    clear();
    root.appendChild(el("h1", heading, headingClass || ""));
    if (sub) root.appendChild(el("p", sub, "sub"));
  }

  var KIND_LABEL = {
    sql: "Database change",
    lovable: "Frontend change",
    config: "Configuration change",
    investigate: "Investigation"
  };

  function field(dl, term, value, cls) {
    if (value === undefined || value === null || value === "") return;
    dl.appendChild(el("dt", term));
    dl.appendChild(el("dd", value, cls || ""));
  }

  function render(payload) {
    var p = payload.proposal;

    if (!payload.decidable) {
      if (payload.expired) {
        simple(p.title, "This expired and can no longer be decided. If it still matters the " +
          "agent will raise it again.");
      } else {
        simple(p.title, "Already " + p.status + ". Nothing further to do.");
      }
      return;
    }

    clear();
    root.appendChild(el("h1", p.title));

    var sub = el("p", "", "sub");
    if (p.ticket_title) sub.appendChild(document.createTextNode("On: " + p.ticket_title + " "));
    if (p.remedy_kind) {
      sub.appendChild(el("span", KIND_LABEL[p.remedy_kind] || p.remedy_kind, "tag"));
    }
    root.appendChild(sub);

    var dl = document.createElement("dl");
    field(dl, "What is wrong", p.rationale);
    if (p.instructions) {
      dl.appendChild(el("dt", "Proposed fix"));
      var dd = document.createElement("dd");
      dd.appendChild(el("pre", p.instructions));
      dl.appendChild(dd);
    }
    field(dl, "What changes", p.impact);
    field(dl, "Risk", p.risk, "risk");
    field(dl, "How it gets undone", p.reversal);
    root.appendChild(dl);

    root.appendChild(document.createElement("hr"));

    var label = el("label", "Want it done differently? Say so here, then press Approve with changes.");
    label.setAttribute("for", "adjustment");
    root.appendChild(label);

    var box = document.createElement("textarea");
    box.id = "adjustment";
    box.placeholder = "Optional. For example: do this but only for the affected rows, or wait until after the launch.";
    root.appendChild(box);

    var hint = el("p", "", "hint");
    hint.style.display = "none";
    root.appendChild(hint);

    var actions = el("div", "", "actions");
    var buttons = [
      { text: "Approve", decision: "approved", cls: "approve" },
      { text: "Approve with changes", decision: "adjusted", cls: "adjust" },
      { text: "Reject", decision: "rejected", cls: "reject" }
    ].map(function (spec) {
      var b = el("button", spec.text, spec.cls);
      b.type = "button";
      b.addEventListener("click", function () { submit(spec.decision); });
      actions.appendChild(b);
      return b;
    });
    root.appendChild(actions);

    root.appendChild(el("p",
      (p.kind === "remedy"
        ? "Approving records your decision and keeps these exact instructions with the ticket. " +
          "It does not run anything: the agent never changes code or runs a migration on its " +
          "own, whatever is approved."
        : "Approving records your decision. The agent carries it out on its next run, inside " +
          "the same action ledger as everything else it does, so it stays reversible.") +
      " This link works once.", "note"));

    function submit(decision) {
      var adjustment = box.value.trim();

      if (decision === "adjusted" && adjustment.length < 3) {
        hint.textContent = "Write what you want changed, or press Approve to take it as proposed.";
        hint.style.display = "";
        box.focus();
        return;
      }
      hint.style.display = "none";
      buttons.forEach(function (b) { b.disabled = true; });

      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ t: token, decision: decision, adjustment: adjustment })
      })
        .then(function (r) { return r.json().catch(function () { return { error: "bad_response" }; }); })
        .then(function (d) {
          if (d && d.ok) return done(d.status, d.title);
          if (d && d.error === "already_decided") {
            return simple("Already " + (d.status || "decided"),
              "Someone, probably you, has already answered this one.");
          }
          if (d && d.error === "not_found") {
            return simple("This proposal is not available",
              "The link may already have been used.");
          }
          if (d && d.error === "expired") {
            return simple("This proposal has expired",
              "If it still matters the agent will raise it again.");
          }
          buttons.forEach(function (b) { b.disabled = false; });
          hint.textContent = "That did not go through and nothing was changed. Try again.";
          hint.style.display = "";
        })
        .catch(function () {
          buttons.forEach(function (b) { b.disabled = false; });
          hint.textContent = "Could not reach the server. Check your connection and try again. " +
            "Nothing was changed.";
          hint.style.display = "";
        });
    }
  }

  function done(status, title) {
    var heading = status === "rejected" ? "Rejected"
      : status === "adjusted" ? "Approved with changes" : "Approved";
    var body = status === "rejected"
      ? "Nothing will be done. The agent will not raise this same proposal again."
      : status === "adjusted"
        ? "Your changes are recorded with the ticket, alongside the original proposal, so it " +
          "is clear which words are yours."
        : "Recorded against the ticket. Anything the agent is allowed to do itself will happen " +
          "on its next run; anything that needs a code or migration change is now written down " +
          "and waiting, so nobody has to work it out again.";
    clear();
    root.appendChild(el("h1", heading));
    if (title) root.appendChild(el("p", title, "sub"));
    root.appendChild(el("p", body));
    root.appendChild(el("p", "You can close this page.", "note"));
  }

  function load() {
    if (!token) {
      if (new URLSearchParams(window.location.search).get("opened") === "1") {
        simple("Open the link again",
          "This page was already opened in this tab, and the one-time token is deliberately " +
          "not kept in the address bar. Open the link from the email again to decide.");
      } else {
        simple("Nothing to decide", "This link is missing its token.", "bad");
      }
      return;
    }
    fetch(ENDPOINT + "?format=json&t=" + encodeURIComponent(token), {
      method: "GET",
      headers: { "Accept": "application/json" }
    })
      .then(function (r) { return r.json().catch(function () { return { error: "bad_response" }; }); })
      .then(function (d) {
        if (d && d.ok) return render(d);
        if (d && d.error === "not_found") {
          return simple("This proposal is not available",
            "The link may be from an old digest, it may already have been used, or the " +
            "proposal has been removed. The current list is in today's digest.");
        }
        if (d && d.error === "missing_token") {
          return simple("Nothing to decide", "This link is missing its token.", "bad");
        }
        retryable("Something went wrong reading this proposal.");
      })
      .catch(function () {
        retryable("Could not reach the server.");
      });
  }

  function retryable(message) {
    clear();
    root.appendChild(el("h1", "Not loaded", "bad"));
    root.appendChild(el("p", message + " Nothing has been decided.", "sub"));
    var b = el("button", "Try again", "approve");
    b.type = "button";
    b.addEventListener("click", function () { simple("Loading…", ""); load(); });
    var wrap = el("div", "", "actions");
    wrap.appendChild(b);
    root.appendChild(wrap);
  }

  load();
})();
</script>
</body>
</html>
